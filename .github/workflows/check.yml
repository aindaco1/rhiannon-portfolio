name: Verify portfolio
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          # Set a read-only token with access to the private Platform repository.
          token: ${{ secrets.PLATFORM_READ_TOKEN || github.token }}
      - uses: ./.github/actions/verify-site
